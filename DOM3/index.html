<!DOCTYPE html>
<html lang="en">

<!--Selects the first element that matches specified selector-->

<head>

    <title>querySelector</title>
</head>

<body>

    <p class="para">Paragraph1</p>
    <p class="para">Paragraph2</p>


    <script>

        const target = document.querySelector('.para');
        console.log(target)// first element will get


    </script>

</body>

</html>
