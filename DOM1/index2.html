<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculater</title>

    <!--
    1. Target the element.
    2. get the value.
    3. Set the value.
    -->

</head>

<body>
    <input type="text" id="in1"><br> <br>
    <input type="text" id="in2"><br> <br>
    <button onclick="addition()">Add</button>
    <h3 id="msg"></h3>

    <script>
        function addition() {

            let num1 = Number(document.getElementById('in1').value); // Target the Element
            console.log(num1, typeof num1); //get the Value

            let num2 = Number(document.getElementById('in2').value);
            console.log(num2, typeof num2);

            let res = document.getElementById('msg');
            console.log(res);
            res.innerHTML = `Addition is ${num1 + num2}`; // Set the Value

        }


    </script>
</body>

</html>
