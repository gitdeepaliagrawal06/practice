<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./Form2.css">
</head>

<body>
    <form action="" class="MyForm">
        <div>
            <label for="">First Name</label>
            <input type="text" placeholder="Enter First Name">
            <label for=""> ( Max 50 Character Allowed )</label>

        </div>
        <div>
            <label for="">Last Name</label>
            <input type="text" placeholder="Enter Last Name">
            <label for=""> ( Max 50 Character Allowed )</label>
        </div>
        <div>
            <label for="">Email ID</label>
            <input type="text" placeholder="Enter Email ID">

        </div>
        <div>
            <label for="">Mobile Number</label>
            <input maxlength="10" type="text" placeholder="Enter Mobile Number">
            <label for=""> ( Max 10 Digits Allowed )</label>
        </div>
        <div>
            <label for="">Gender</label>
            <input id="m" name="Gender" type="radio"> <label for="m">Male</label>
            <input id="F" name="Gender" type="radio"> <label for="F">Female</label>
        </div>
        <div>
            <label for="">Date of Birth (DOB)</label>
            <select name="" id="">
                <option value="Day">Day</option>
            </select>
            <select name="" id="">
                <option value="Month">Month</option>
            </select>
            <select name="" id="">
                <option value="Year">Year</option>
            </select>
        </div>

        <div class="address">
            <label for="">Address</label>
            <textarea rows="10" cols="40" name="" id=""></textarea>
        </div>
        <div>
            <label for="">City</label>
            <input type="text" placeholder="Enter City Name">
            <label for=""> ( Max 50 Character Allowed )</label>

        </div>
        <div>
            <label for="">Pincode</label>
            <input type="text" placeholder="Enter Pincode">
            <label for=""> ( Max 6 Character Allowed )</label>

        </div>
        <div>
            <label for="">State</label>
            <input type="text" placeholder="Enter State Name">
            <label for=""> ( Max 50 Character Allowed )</label>

        </div>
        <div>
            <label for="">County</label>
            <input type="text" placeholder="Enter County Name">
        </div>

        <div>
            <label for="">Hobbies</label>
            <input type="checkbox">
            <label for="">Drawing</label>
            <input type="checkbox">
            <label for="">Dancing</label>
            <input type="checkbox">
            <label for="">Singing</label>
            <input type="checkbox">
            <label for="">Sketching</label>
            <input type="checkbox">
            <label for="">Others</label>
            <input type="text" placeholder="Example Teaching">
            <label for=""> ( Max 50 Character Allowed )</label>
        </div>
        <div>
            <label for="">Qualification</label>
            <span>
                <div>
                    <input type="checkbox">
                    <label for="">High School (10)</label>
                </div>
                <div>
                    <input type="checkbox">
                    <label for="">Higher School (12)</label>
                </div>
                <div>
                    <input type="checkbox">
                    <label for="">Graduation (Becholore)</label>
                </div>

                <div>
                    <input type="checkbox">
                    <label for="">Post Graduation (Master)</label>
                </div>
                <div>
                    <input type="checkbox">
                    <label for="">Phd</label>
                </div>
            </span>

        </div>

        <div>

            <label for="">Courses Applied for</label>
            <div>
                <div>
                    <input type="radio">
                    <label for="">BCA</label>
                </div>
                <div>
                    <input type="radio">
                    <label for="">B.com</label>
                </div>
                <div>
                    <input type="radio">
                    <label for="">Bsc</label>
                </div>
                <div>
                    <input type="radio">
                    <label for="">BA</label>
                </div>
                <div>
                    <input type="radio">
                    <label for="">Phd</label>
                </div>

            </div>

        </div>
        <div class="mybtn">
            <input type="submit">
            <input type="reset">
        </div>
    </form>
</body>

</html>
