<html lang="en">

<head>

<body>

  <h2>User Information Form</h2>

  <!-- Input fields -->
  <input type="text" id="fname" placeholder="First Name">
  <input type="text" id="lname" placeholder="Last Name">
  <input type="number" id="age" placeholder="Age">
  <input type="text" id="number" placeholder="Phone Number">
  <button onclick="addData()">Add</button>

  <h3>Users Table</h3>
  <!-- Table to display data -->
  <table id="userTable" border="1">
    <tr>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Age</th>
      <th>Number</th>
    </tr>
  </table>

  <script>
    // Function to add data into table
    function addData() {
      // Get values from input fields
      const fname = document.getElementById("fname").value;
      const lname = document.getElementById("lname").value;
      const age = document.getElementById("age").value;
      const number = document.getElementById("number").value;

      // Only add row if all fields are filled
      if (fname !== "" && lname !== "" && age !== "" && number !== "") {
        // Get table reference
        const table = document.getElementById("userTable");

        // Insert new row at the end
        const newRow = table.insertRow();

        // Insert 4 cells for 4 columns
        const cell1 = newRow.insertCell(0);
        const cell2 = newRow.insertCell(1);
        const cell3 = newRow.insertCell(2);
        const cell4 = newRow.insertCell(3);

        // Put input values into cells
        cell1.innerText = fname;
        cell2.innerText = lname;
        cell3.innerText = age;
        cell4.innerText = number;

        // Clear input fields after adding
        document.getElementById("fname").value = "";
        document.getElementById("lname").value = "";
        document.getElementById("age").value = "";
        document.getElementById("number").value = "";
      } else {
        alert("Please fill all fields before adding!");
      }
    }
  </script>

</body>

</html>
