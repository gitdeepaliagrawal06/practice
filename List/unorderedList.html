<!DOCTYPE html>
<html lang="en">

<head>

    <title>Unordered List</title>
</head>

<body>

    <h3>Unordered List</h3>

    <ul>
        <li>list1</li>
        <li>list2</li>
        <li>list3</li>
        <li>list4</li>
    </ul>

    <ul type="circle">
        <li>Coffee</li>
        <li>Tea</li>
        <li>Milk</li>
        <li>Sugar</li>
    </ul>


    <ul type="square">
        <li>Coffee</li>
        <li>Tea</li>
        <li>Milk</li>
        <li>Sugar</li>
    </ul>

</body>

</html>
