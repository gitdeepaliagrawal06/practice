<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build complete layout Step by Step</title>
    <style>
        .mydiv {
            height: 97vh;
        }

        .outer {
            border: 5px solid red;
            /* height: 80vh; */
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 3fr;
            grid-template-rows: auto 1fr auto;
            gap: 10px;

        }

        header,
        aside,
        main,
        footer {
            border: 2px solid black;
            padding: 20px;
        }


        header {
            grid-column: 1/3;
        }

        footer {
            grid-column: 1/3;
        }

        main {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 5px;
        }

        article {
            border: 3px solid blue;
            /* height: 100px; */

        }
    </style>
</head>

<body>
    <div class="mydiv">
        <div class="outer">
            <header>Header</header>
            <aside>Aside</aside>
            <main>
                <article>A1</article>
                <article>A2</article>
                <article>A3</article>
            </main>
            <footer>Footer</footer>


        </div>
    </div>
</body>

</html>
