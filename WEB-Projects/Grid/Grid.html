<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .outer {
            display: grid;
            grid-template-columns: 1fr 3fr;
        }

        header,
        aside,
        main,
        footer {
            border: 2px solid black;
            padding: 20px;
        }

        header {
            grid-column: 1/3;
        }

        footer {
            grid-column: 1/3;
        }
    </style>
</head>

<body>
    <div class="outer">
        <header>Header</header>
        <aside>Aside</aside>
        <main>Main</main>
        <footer>Footer</footer>


    </div>
</body>

</html>
