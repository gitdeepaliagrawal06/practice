<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Element Selector/ Type Selector*/
        p {
            color: red;
        }

        /* Group Selector */
        h3,
        h2 {
            background-color: aqua;
        }

        /* ID Selector*/
        #main-heading {
            background-color: yellow;
            width: 100vw;
            font-size: 40px;
            font-weight: bold;
        }

        /*class Selector */
        .sub-heading-styles {
            border: 2px solid blue;
            background-color: lightskyblue;
            border-radius: 5px;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            font-family: cursive;
        }

        .border-styles {
            border: 5px dotted rebeccapurple;

        }

        /* Universal Selector Selects all the elements  */
        * {
            background-color: lightgreen;
        }
    </style>
</head>

<body>
    <h3 id="main-heading">Main Heading of website</h3>
    <h3>Main Para Heading</h3>
    <p>Lorem ipsum dolor sit amet.</p>
    <p>Lorem, ipsum.</p>

    <!--Multipale class selector -->
    <h3 class="sub-heading-styles border-styles"> Sub heading for product</h3>
    <h3 class="sub-heading-styles">sub heading for some home</h3>

</body>

</html>
