<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdjacentSiblingSelector Example</title>

    <style>
        div h3+p {
            color: red;
        }
    </style>
</head>

<body>
    <div>
        <h3>Heading</h3>
        <p>some para for heading</p>

        <h2>Heading 2</h2>
        <p>some for heading 2</p>
    </div>
    <h3>Heading 3 </h3>
    <p>Para for heading</p>
</body>

</html>
