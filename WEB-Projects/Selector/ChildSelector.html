<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child Selector</title>
    <style>
        ul>li {
            list-style-type: circle;
            color: red;
        }
    </style>
</head>

<body>
    <ul>
        <li>First direct child item</li>
        <li>Second direct child item</li>
        <ol>
            <li>This is a nested list (won't be styled)</li>
        </ol>
    </ul>
</body>

</html>
