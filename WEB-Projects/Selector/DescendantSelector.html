<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descendant Selector Example</title>
    <style>
        div p {
            color: blue;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div>
        <h3>This is a heading inside a div.</h3>

        <p>This p inside div will be styled</p>
    </div>
    <p>This paragraph is outside the div and won't be affected.</p>
    <p>This p is also outside the div and won't be styled</p>
</body>

</html>
