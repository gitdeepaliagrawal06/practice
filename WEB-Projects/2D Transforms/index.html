<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Transform by love bhaiya</title>
    <style>
        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background-color: beige;
            color: black;
            border: 2px solid black;
            height: 300px;
            width: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            margin: auto;
            transition: all 3s linear 1s;

        }

        .box:hover {
            /* transform: rotate(360deg); */
            /* transform: scale(2); */
            /* transform: scale(0.5); */
            /* transform: rotate(45deg); */
            /* transform: skew(45deg); */
            transform: translate(0px, 500px);

        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            <p>This is CodeHelp's box</p>
        </div>
    </div>

</body>

</html>
