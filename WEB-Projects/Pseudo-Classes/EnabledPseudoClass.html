<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enabled-Pseudo-Class</title>
    <style>
        input:disabled {
            background-color: lightgray;
        }

        input:enabled {
            background-color: lightblue;
            border: 2px solid blue;
        }
    </style>
</head>

<body>
    <input type="text" value="I am enabled">
    <input type="text" disabled value="I am disabled">
</body>

</html>
