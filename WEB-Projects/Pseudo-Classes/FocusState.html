<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus-State</title>
    <style>
        input[type="email"]:focus {
            background-color: lightsteelblue;
        }
    </style>
</head>

<body>
    <input type="email">
    <input type="text">
</body>

</html>
