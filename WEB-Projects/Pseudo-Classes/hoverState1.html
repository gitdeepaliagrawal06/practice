<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover-State</title>
    <style>
        .button {
            padding: 10px 20px;
            background-color: black;
            color: white;
            border: none;
            cursor: pointer;

        }

        .button:hover {
            background-color: white;
            color: black;
        }
    </style>
</head>

<body>
    <button class="button">Hover over me!
    </button>
</body>

</html>
