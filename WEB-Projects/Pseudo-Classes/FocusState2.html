<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus-State</title>
    <style>
        input {
            padding: 10px;
            border: 2px solid gray;
        }

        input:focus {
            background-color: lightseagreen;
        }
    </style>
</head>

<body>
    <input type="text" placeholder="Focus on me!">
</body>

</html>
