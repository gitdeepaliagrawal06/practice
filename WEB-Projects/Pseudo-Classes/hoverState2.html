<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover-State-2</title>
    <!-- Hover State (selector:hover)-->
    <style>
        div p:hover {
            border:
                2px solid;
            height:
                50px;
            width:
                100vw;
            background-color:
                yellow;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <p>Hover State</p>
    <div>
        <p>
            Hover on me to give a Border....
        </p>
    </div>
</body>

</html>
