<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nthChild-State</title>
    <style>
        table {
            width: 80%;
            /* Table width */
            height: 400px;
            /* Table height*/
            border-collapse: collapse;
            /* Collapse borders*/
            margin: 20px auto;
            /*Center the table on the page*/
        }

        th,
        td {
            border: 1px solid black;
            /*Add border to table cells*/
            padding: 10px;
            /*Space inside cells*/
            text-align: left;
            /*Align text to the left*/
        }

        th {
            background-color: lightgray;
            /* Background color for header */
        }

        tr:nth-child(odd) {
            background-color: lightcoral;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <td>Row 1</td>
        </tr>
        <tr>
            <td>Row 2</td>
        </tr>
        <tr>
            <td>Row 3</td>
        </tr>
        <tr>
            <td>Row 4</td>
        </tr>

    </table>
</body>

</html>
