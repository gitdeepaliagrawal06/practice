<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            color: red;
            font-size: 50px;
            font-weight: bold;
            font-family: cursive;
        }

        h3 {
            color: blue;
        }
    </style>
</head>

<body>
    <p>Hello from Internal CSS</p>
    <p>Lorem ipsum dolor sit amet.</p>
    <h3>Lorem, ipsum dolor.</h3>
</body>
<!-- 
1. In Internal CSS, we use style as an Tag.
2. When we use Internal CSS, Styling will be applied to that complete document -->

</html>
