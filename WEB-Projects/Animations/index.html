<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation by Manish bhaiya</title>
    <style>
        .box {
            --w: 100px;
            width: var(--w);
            height: var(--w);
            background: url(./cartoony-penguin-studio_23-21510.png);
            background-size: cover;
            transition: all 15s;
            transform-origin: 50% 100%;
            transform: scale(1) translate(0, 0) skew(0deg, 0deg);


            /* margin: 100px; */
            margin-top: 100px;
            background-color: blueviolet;
            font-size: 100PX;
            font-weight: 900;
            /* animation-name: jk;
            animation-duration: 6s;
            animation-iteration-count: 1; */
            /* animation-delay: 10s; */

            /*Short handed property*/
            animation: jk 3s infinite alternate;
        }

        @keyframes jk {
            0% {
                transform: translate(0, 0);
            }


            25% {
                transform: translate(400px, 0);

            }

            50% {
                transform: translate(400px, 0px);
                background: url(./cute-penguin-standing-cartoon-vector-icon-illustration-animal-nature-icon-concept-isolated-premium_138676-4656.avif);
                background-size: contain;
                border: 5px solid;
                border-radius: 50%;

            }

            75% {
                transform: translate(0, 400px);

            }

            100% {
                transform: translate(0, 0);
            }
        }
    </style>
</head>

<body>
    <div class="box">

    </div>


</body>

</html>
