<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex by manish bhaiya</title>
    <style>
        .box {
            width: 300px;
            height: 300px;
            background-color: blueviolet;

            /* display: flex; */
            justify-content: space-evenly;
            align-items: center;

            flex-direction: column-reverse;

            justify-self: center;

            .child {
                --w: 30px;
                width: var(--w);
                height: var(--w);
                background-color: rgb(0, 0, 0);
                /* margin: 2px; */
                color: white;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .child:nth-child(2) {
                background-color: red;
                position: absolute;
                z-index: -1;


                bottom: 0;
            }
        }
    </style>
</head>

<body>

    <div class="box">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
    </div>

</body>

</html>
