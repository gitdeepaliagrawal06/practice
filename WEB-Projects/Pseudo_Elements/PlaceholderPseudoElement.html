<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style the Placeholder Text of an Input Field</title>
    <style>
        input::placeholder {
            color: grey;
            font-style: italic;
        }
    </style>
</head>

<body>
    <input type="text" placeholder="Enter your name here">
</body>

</html>
