<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style the First line of a Paragraph</title>
    <style>
        p::first-line {
            background-color: lightpink;
        }
    </style>
</head>

<body>
    <p> This is a simple para where the first line will be styled.
        Only the first line will have a border and background color applied to it.
        This is useful for highlighting the beginning of a section.
    </p>
</body>

</html>
