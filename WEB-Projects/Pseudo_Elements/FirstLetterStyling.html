<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Letter Styling</title>
    <style>
        p::first-letter {
            font-size: 2em;
            color: blue;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <p>
        This is a simple para where the first letter will be styled.
        Only the first letter will have a border and background color applied to it.
    </p>
</body>

</html>
