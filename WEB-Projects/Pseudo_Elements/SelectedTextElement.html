<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style the Selected Text</title>
    <style>
        p::selection {
            background-color: yellow;
            color: black;
        }
    </style>
</head>

<body>
    <p>Try selecting this text to see the custom styling for selected text</p>
</body>

</html>
