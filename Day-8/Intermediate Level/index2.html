<!DOCTYPE html>
<html lang="en">

<head>

  <title>Problem-2</title>
</head>

<body>
  <!-- 
  You have a tasks array = ["Do homework", "Clean room", "Go for walk"].

  Use push() to add a new task.
  
  Use pop() to remove the last one.
  
  Show the final list of tasks in console.
  -->
</body>

<script>

  const task = ["Do homework", "Clean room", "Go for walk"];
  task.push("Have Lunch");
  console.log("Add Task :", task);
  task.pop();
  console.log("remove Last element :", task);

  console.log("final list of tasks : ", task);





</script>

</html>
