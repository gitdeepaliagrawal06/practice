<body>
  <!-- Create an array of ["apple", "banana", "orange", "mango"].

Use indexOf() to find "orange".

Replace "orange" with "grapes" using splice().

Print the new array. -->
</body>
<script>

  const fruits = ["apple", "banana", "orange", "mango"];
  const index = fruits.indexOf("orange");

  console.log("Index of element :", index);

  fruits.splice(index, 1, 'grapes');
  console.log(fruits);











</script>







</html>
