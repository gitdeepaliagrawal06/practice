  <!-- Create an array of movie names.

      Remove the first 2 movies using splice().

      Add 2 new movies at the same position (use splice for adding). -->

</body>
<script>
  const movies = ["Inception", "The Dark Knight", "Interstellar", "Titanic", "Avatar", "The Avengers", "Jurassic Park", "Gladiator", "The Matrix", "Forrest Gump"];

  removeMov = movies.splice(0, 2);
  console.log("Remove the first 2 movies: ", removeMov);
  movies.splice(0, 0, 'Guru', 'Lagaan')
  console.log("Add 2 new movies at the same position :", movies);







</script>
