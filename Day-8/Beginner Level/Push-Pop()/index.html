<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Push-Pop</title>
</head>

<body>
  <script>

    const fruits = ["Mango", "Kiwi", "Banana", "Orange", "Guava"]
    console.log(fruits);
    fruits.push("Papaya");//
    console.log("Fruits Name : ", fruits);//['Mango', 'Kiwi', 'Banana', 'Orange', 'Guava', 'Papaya']

    fruits.pop();
    console.log(fruits);//['Mango', 'Kiwi', 'Banana', 'Orange', 'Guava']
    //Last in Last out



  </script>





</body>

</html>
