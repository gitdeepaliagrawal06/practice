<!DOCTYPE html>
<html lang="en">

<head>

  <title>Slice()</title>
</head>

<body>

  <script>

    const originalColorArray = ["Red", "Green", "Blue", "Orange", "White", "Black"]
    console.log("Color Name :", originalColorArray);
    const copyOfColorArray = originalColorArray.slice();
    console.log("copyOfColorArray", copyOfColorArray);

    //Use slice() to copy only the first 3 colors into a new array.
    const copyColorArray = originalColorArray.slice(0, 3);
    console.log("copyColorArray :", copyColorArray);

    // Extract elements from index 2 to the end

    const anotherColorArray = originalColorArray.slice(2);
    console.log("anotherColorArray", anotherColorArray);

    // Extract elements from index 1 (inclusive) to index 4 (exclusive)

    const copy1 = originalColorArray.slice(1, 4);
    console.log("copy1 :", copy1);









  </script>

</body>

</html>
