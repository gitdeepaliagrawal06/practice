<!DOCTYPE html>
<html lang="en">

<head>

  <title>IndexOf</title>
</head>

<body>

  <script>
    const number = ["10", "20", "30", "40", "50", "60"];
    console.log(number);

    const index = number.indexOf("40");
    console.log("Print index of number : ", index);
    const removeNum = number.splice(index, 1);
    console.log("removeNum :", removeNum)

    console.log("After using splice original Array :", number)





  </script>

</body>

</html>
